name: C499 LMFDB SQL Inventory

on:
  push:
    branches: [c499-lmfdb-inventory-20260731]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGHOST: devmirror.lmfdb.xyz
      PGPORT: '5432'
      PGDATABASE: lmfdb
      PGUSER: lmfdb
      PGPASSWORD: lmfdb
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Freeze schema and all level-333839 weight-2 orbit rows
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p c499_lmfdb_sql
          psql -X -v ON_ERROR_STOP=1 -At -F $'\t' <<'SQL' > c499_lmfdb_sql/server_version.tsv
          select current_database(), current_user, version();
          SQL

          psql -X -v ON_ERROR_STOP=1 --csv <<'SQL' > c499_lmfdb_sql/schema_columns.csv
          select table_name, ordinal_position, column_name, data_type, udt_name
          from information_schema.columns
          where table_schema='public'
            and table_name in ('mf_newforms','mf_newspaces','mf_hecke_nf','mf_hecke_traces','mf_hecke_charpolys')
          order by table_name, ordinal_position;
          SQL

          psql -X -v ON_ERROR_STOP=1 --csv <<'SQL' > c499_lmfdb_sql/newforms_level333839_weight2.csv
          select *
          from mf_newforms
          where level=333839 and weight=2
          order by label;
          SQL

          psql -X -v ON_ERROR_STOP=1 --csv <<'SQL' > c499_lmfdb_sql/newspaces_level333839_weight2.csv
          select *
          from mf_newspaces
          where level=333839 and weight=2
          order by label;
          SQL

          psql -X -v ON_ERROR_STOP=1 --csv <<'SQL' > c499_lmfdb_sql/orbit_dimension_audit.csv
          select count(*) as orbit_count,
                 coalesce(sum(dim),0) as sum_orbit_dimensions,
                 min(dim) as min_orbit_dimension,
                 max(dim) as max_orbit_dimension,
                 count(*) filter (where dim=1) as rational_orbit_count
          from mf_newforms
          where level=333839 and weight=2;
          SQL

          psql -X -v ON_ERROR_STOP=1 --csv <<'SQL' > c499_lmfdb_sql/hecke_nf_selected_level.csv
          select h.*
          from mf_hecke_nf h
          join mf_newforms f using (hecke_orbit_code)
          where f.level=333839 and f.weight=2
          order by f.label;
          SQL

          psql -X -v ON_ERROR_STOP=1 --csv <<'SQL' > c499_lmfdb_sql/hecke_traces_selected_level.csv
          select h.*
          from mf_hecke_traces h
          join mf_newforms f using (hecke_orbit_code)
          where f.level=333839 and f.weight=2
          order by f.label;
          SQL

          psql -X -v ON_ERROR_STOP=1 --csv <<'SQL' > c499_lmfdb_sql/hecke_charpolys_selected_level.csv
          select h.*
          from mf_hecke_charpolys h
          join mf_newforms f using (hecke_orbit_code)
          where f.level=333839 and f.weight=2
          order by f.label;
          SQL

          python3 - <<'PY'
          import csv, hashlib, json, pathlib
          root=pathlib.Path('c499_lmfdb_sql')
          audit=list(csv.DictReader((root/'orbit_dimension_audit.csv').open()))[0]
          rows=list(csv.DictReader((root/'newforms_level333839_weight2.csv').open()))
          summary={
              'schema':'bsd-c499-lmfdb-sql-inventory-v1',
              'level':333839,
              'weight':2,
              'orbit_count':int(audit['orbit_count']),
              'sum_orbit_dimensions':int(audit['sum_orbit_dimensions']),
              'min_orbit_dimension':int(audit['min_orbit_dimension']),
              'max_orbit_dimension':int(audit['max_orbit_dimension']),
              'rational_orbit_count':int(audit['rational_orbit_count']),
              'labels':[r['label'] for r in rows],
              'dimensions':{r['label']:int(r['dim']) for r in rows},
              'field_polynomials':{r['label']:r.get('field_poly') for r in rows},
              'self_twist_discs':{r['label']:r.get('self_twist_discs') for r in rows},
              'newspace_dimension_reference':23980,
          }
          summary['dimension_sum_matches_reference']=(summary['sum_orbit_dimensions']==23980)
          (root/'SUMMARY.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n',encoding='utf-8',newline='\n')
          lines=['# C499 LMFDB SQL inventory','',
                 f"- orbit count: {summary['orbit_count']}",
                 f"- sum of orbit dimensions: {summary['sum_orbit_dimensions']}",
                 f"- independent newspace dimension: {summary['newspace_dimension_reference']}",
                 f"- dimension sum matches: {summary['dimension_sum_matches_reference']}",
                 f"- rational orbit count: {summary['rational_orbit_count']}",
                 f"- dimension range: {summary['min_orbit_dimension']}..{summary['max_orbit_dimension']}",'',
                 'The equality of dimension sums audits completeness at this level relative to the independently certified newspace dimension.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8',newline='\n')
          paths=sorted(p for p in root.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')
          with (root/'SHA256SUMS.txt').open('w',encoding='utf-8',newline='\n') as fh:
              for p in paths:
                  fh.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

          cat c499_lmfdb_sql/SUMMARY.md
          du -h c499_lmfdb_sql/*

      - name: Upload C499 SQL inventory
        uses: actions/upload-artifact@v4
        with:
          name: c499-lmfdb-sql-inventory
          path: c499_lmfdb_sql
          if-no-files-found: error
          retention-days: 3
