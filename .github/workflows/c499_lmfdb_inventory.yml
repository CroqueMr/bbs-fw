name: C499 LMFDB Inventory

on:
  push:
    branches: [c499-lmfdb-inventory-20260731]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Query LMFDB API and freeze raw responses
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p c499_lmfdb/raw
          cat > c499_lmfdb/query_lmfdb.py <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          ROOT = pathlib.Path('c499_lmfdb')
          RAW = ROOT / 'raw'
          BASE = 'https://www.lmfdb.org/api/'
          HEADERS = {
              'User-Agent': 'BSD-C499-reproducible-inventory/1.0',
              'Accept': 'application/json',
          }

          def get_json(url, attempts=7):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          body = resp.read()
                          status = resp.status
                          ctype = resp.headers.get('content-type', '')
                      if status != 200:
                          raise RuntimeError(f'HTTP {status}')
                      return json.loads(body.decode('utf-8')), body, ctype
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 ** attempt, 20))
              raise RuntimeError(f'failed after {attempts} attempts: {url}: {last}')

          def canonical(obj):
              return json.dumps(obj, sort_keys=True, ensure_ascii=False, separators=(',', ':')).encode('utf-8') + b'\n'

          def save_raw(stem, page_no, body):
              p = RAW / f'{stem}_page_{page_no:03d}.json'
              p.write_bytes(body if body.endswith(b'\n') else body + b'\n')
              return str(p)

          def fetch_all(collection, params, stem):
              query = urllib.parse.urlencode(params)
              url = urllib.parse.urljoin(BASE, collection + '/') + '?' + query
              rows = []
              pages = []
              seen = set()
              page_no = 0
              while url:
                  if url in seen:
                      raise RuntimeError(f'pagination loop: {url}')
                  seen.add(url)
                  page_no += 1
                  payload, body, ctype = get_json(url)
                  raw_path = save_raw(stem, page_no, body)
                  data = payload.get('data', []) if isinstance(payload, dict) else []
                  if not isinstance(data, list):
                      raise RuntimeError(f'non-list data in {url}')
                  rows.extend(data)
                  pages.append({
                      'url': url,
                      'raw_path': raw_path,
                      'row_count': len(data),
                      'content_type': ctype,
                      'keys': sorted(payload.keys()) if isinstance(payload, dict) else [],
                  })
                  nxt = payload.get('next') if isinstance(payload, dict) else None
                  if nxt in (None, '', False):
                      break
                  url = urllib.parse.urljoin(url, nxt)
              return {'collection': collection, 'params': params, 'pages': pages, 'rows': rows}

          errors = []
          inventory = {
              'schema': 'bsd-c499-lmfdb-inventory-v1',
              'query_level': 333839,
              'query_weight': 2,
              'base_url': BASE,
              'collections': {},
              'per_orbit': {},
              'errors': errors,
          }

          core_queries = {
              'mf_newforms': {'level': 'i333839', 'weight': 'i2', '_format': 'json'},
              'mf_newspaces': {'level': 'i333839', 'weight': 'i2', '_format': 'json'},
              'ec_curvedata': {'conductor': 'i333839', '_format': 'json'},
          }
          for coll, params in core_queries.items():
              try:
                  inventory['collections'][coll] = fetch_all(coll, params, coll)
              except Exception as exc:
                  errors.append({'collection': coll, 'params': params, 'error': repr(exc)})

          newforms = inventory['collections'].get('mf_newforms', {}).get('rows', [])
          labels = sorted({str(r.get('label')) for r in newforms if r.get('label')})
          orbit_codes = sorted({str(r.get('hecke_orbit_code')) for r in newforms if r.get('hecke_orbit_code') is not None})

          for idx, row in enumerate(newforms):
              label = str(row.get('label') or f'row_{idx}')
              code = row.get('hecke_orbit_code')
              key = label
              entry = {'label': label, 'hecke_orbit_code': code, 'queries': {}}
              inventory['per_orbit'][key] = entry
              selectors = []
              if code is not None:
                  selectors.append(('hecke_orbit_code', 'i' + str(code)))
              selectors.append(('label', 's' + label))
              for coll in ['mf_hecke_nf', 'mf_hecke_traces', 'mf_hecke_charpolys']:
                  success = False
                  local_errors = []
                  for field, value in selectors:
                      params = {field: value, '_format': 'json'}
                      stem = f'{coll}_{label.replace(".", "_")}_{field}'
                      try:
                          result = fetch_all(coll, params, stem)
                          entry['queries'][coll] = result
                          success = True
                          if result['rows']:
                              break
                      except Exception as exc:
                          local_errors.append({'field': field, 'value': value, 'error': repr(exc)})
                  if not success:
                      errors.append({'collection': coll, 'label': label, 'errors': local_errors})

          # Also freeze API landing metadata for provenance.
          try:
              payload, body, ctype = get_json('https://www.lmfdb.org/api/')
              (RAW / 'api_landing.json').write_bytes(body if body.endswith(b'\n') else body + b'\n')
              inventory['api_landing_keys'] = sorted(payload.keys()) if isinstance(payload, dict) else []
          except Exception as exc:
              errors.append({'collection': 'api_landing', 'error': repr(exc)})

          inventory['summary'] = {
              'newform_rows': len(newforms),
              'newform_labels': labels,
              'hecke_orbit_codes': orbit_codes,
              'newspace_rows': len(inventory['collections'].get('mf_newspaces', {}).get('rows', [])),
              'elliptic_curve_rows': len(inventory['collections'].get('ec_curvedata', {}).get('rows', [])),
              'error_count': len(errors),
          }
          (ROOT / 'inventory.json').write_bytes(canonical(inventory))

          lines = [
              '# C499 LMFDB inventory', '',
              f"- newform rows: {inventory['summary']['newform_rows']}",
              f"- labels: {', '.join(labels) if labels else '(none)'}",
              f"- newspace rows: {inventory['summary']['newspace_rows']}",
              f"- elliptic curve rows: {inventory['summary']['elliptic_curve_rows']}",
              f"- API errors: {inventory['summary']['error_count']}",
              '',
              'This is a frozen API inventory, not by itself a proof of database completeness.',
          ]
          (ROOT / 'SUMMARY.md').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          paths = sorted(p for p in ROOT.rglob('*') if p.is_file() and p.name != 'SHA256SUMS.txt')
          with (ROOT / 'SHA256SUMS.txt').open('w', encoding='utf-8', newline='\n') as fh:
              for p in paths:
                  fh.write(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.relative_to(ROOT).as_posix() + '\n')

          print(json.dumps(inventory['summary'], sort_keys=True))
          PY
          python3 c499_lmfdb/query_lmfdb.py
          cat c499_lmfdb/SUMMARY.md
          cat c499_lmfdb/SHA256SUMS.txt

      - name: Upload C499 inventory
        uses: actions/upload-artifact@v4
        with:
          name: c499-lmfdb-inventory
          path: c499_lmfdb
          if-no-files-found: error
          retention-days: 3
