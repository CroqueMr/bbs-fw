name: C497 Build PARI-GP

on:
  push:
    branches: [c497-pari-builder-20260731]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-pari:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget ca-certificates libgmp-dev libreadline-dev

      - name: Build PARI-GP 2.17.4
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o pari.tar.gz https://pari.math.u-bordeaux.fr/pub/pari/unix/pari-2.17.4.tar.gz
          tar -xzf pari.tar.gz
          cd pari-2.17.4
          ./Configure --prefix="$GITHUB_WORKSPACE/pari-install"
          make -j2 gp
          make install
          echo 'print(pari_version()); quit' | "$GITHUB_WORKSPACE/pari-install/bin/gp" -fq

      - name: Retrieve exact historical qalg pages and attachments
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/apacetti-site"
          mkdir -p "$ROOT/gp"
          cd "$ROOT/gp"
          for name in vectors bforms qalg qalgmodforms; do
            curl -fL --retry 5 -o "$name.html" "https://sweet.ua.pt/apacetti/gp/$name.html"
          done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          import subprocess

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k.lower() in {'href','src'} and v:
                          self.urls.append(v)

          base='https://sweet.ua.pt/apacetti/gp/'
          root=Path('.')
          urls=set()
          for page in root.glob('*.html'):
              p=P(); p.feed(page.read_text(errors='replace'))
              for u in p.urls:
                  if u.startswith(('javascript:','mailto:','#')): continue
                  urls.add(urljoin(base,u))
          (root/'attachment_urls.txt').write_text('\n'.join(sorted(urls))+'\n')
          for url in sorted(urls):
              name=url.rsplit('/',1)[-1].split('?',1)[0] or 'index'
              if name.lower().endswith(('.gp','.gz','.zip','.tgz','.tar','.txt')):
                  subprocess.run(['curl','-fL','--retry','5','-o',name,url],check=False)
          PY
          sha256sum * > SHA256SUMS_SITE.txt

      - name: Query LMFDB level 333839 inventory
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lmfdb-inventory"
          cd "$GITHUB_WORKSPACE/lmfdb-inventory"
          curl -fL --retry 5 --get 'https://www.lmfdb.org/api/ec_curvedata/' \
            --data-urlencode '_format=json' \
            --data-urlencode 'conductor=333839' \
            -o ec_curvedata_333839.json
          curl -fL --retry 5 --get 'https://www.lmfdb.org/api/mf_newforms/' \
            --data-urlencode '_format=json' \
            --data-urlencode 'level=333839' \
            --data-urlencode 'weight=2' \
            -o mf_newforms_333839_w2.json
          curl -fL --retry 5 --get 'https://www.lmfdb.org/api/mf_newspaces/' \
            --data-urlencode '_format=json' \
            --data-urlencode 'level=333839' \
            --data-urlencode 'weight=2' \
            -o mf_newspaces_333839_w2.json
          python3 - <<'PY'
          import json, pathlib
          summary={}
          for p in pathlib.Path('.').glob('*.json'):
              d=json.load(open(p))
              data=d.get('data', d.get('records', [])) if isinstance(d,dict) else []
              summary[p.name]={'record_count':len(data) if isinstance(data,list) else None}
              if isinstance(data,list):
                  summary[p.name]['records']=[{k:r.get(k) for k in ('label','lmfdb_label','level','weight','dim','char_degree','hecke_orbit_code','analytic_rank','rank','ainvs','trace_hash','is_self_twist') if k in r} for r in data]
          pathlib.Path('summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True,indent=2))
          PY
          sha256sum *.json > SHA256SUMS.txt

      - name: Package binary, PARI source and historical libraries
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$GITHUB_WORKSPACE" -czf c497-pari-linux-x86_64.tar.gz pari-install pari-2.17.4 apacetti-site
          sha256sum c497-pari-linux-x86_64.tar.gz > c497-pari-linux-x86_64.tar.gz.sha256

      - name: Upload PARI artifact
        uses: actions/upload-artifact@v4
        with:
          name: c497-pari-linux-x86_64
          path: |
            c497-pari-linux-x86_64.tar.gz
            c497-pari-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Upload LMFDB inventory
        uses: actions/upload-artifact@v4
        with:
          name: c498-lmfdb-inventory
          path: lmfdb-inventory
          if-no-files-found: error
          retention-days: 3
